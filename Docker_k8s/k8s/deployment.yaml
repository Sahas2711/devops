apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
  labels:
    app.kubernetes.io/name: student-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: student-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-portal
    spec:
      containers:
        - name: student-portal
          image: student-management-portal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
