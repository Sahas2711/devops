---
- name: Deploy Student Management Portal behind Nginx
  hosts: web
  become: true
  gather_facts: true
  vars:
    app_root: /opt/student-portal
    app_port: 3000
    service_name: student-portal

  pre_tasks:
    - name: Verify supported Linux distribution
      ansible.builtin.assert:
        that: [ansible_os_family == "Debian"]
        fail_msg: "This playbook targets Debian/Ubuntu hosts."
    - name: Read installed Node.js version
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false
    - name: Require Node.js 20 or newer
      ansible.builtin.assert:
        that:
          - (node_version.stdout | regex_replace('^v', '')) is version('20.0.0', '>=')
        fail_msg: "Install Node.js 20+ on the managed host before deployment."

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Copy application files
      ansible.builtin.copy:
        src: files/student-portal/
        dest: "{{ app_root }}/"
        owner: root
        group: root
        mode: preserve
    - name: Install systemd service unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Student Management Portal Node.js service
          After=network.target
          [Service]
          Type=simple
          WorkingDirectory={{ app_root }}
          Environment=PORT={{ app_port }}
          ExecStart=/usr/bin/node {{ app_root }}/server.js
          Restart=on-failure
          RestartSec=5
          User=www-data
          Group=www-data
          [Install]
          WantedBy=multi-user.target
      notify: Restart student portal
    - name: Install Nginx reverse-proxy site
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/student-portal
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
      notify: Restart Nginx
    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/student-portal
        dest: /etc/nginx/sites-enabled/student-portal
        state: link
      notify: Restart Nginx
    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx
    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Enable and start application service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
        daemon_reload: true
    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
    - name: Verify application health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
        return_content: true
      register: health_check
      retries: 5
      delay: 2
      until: health_check.status == 200

  handlers:
    - name: Restart student portal
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
